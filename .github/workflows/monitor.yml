name: Check Takachiho boat availability

on:
  schedule:
    # 每 10 分鐘跑一次；GitHub cron 使用 UTC
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  
permissions:
  contents: read
  
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check availability
        env:
          TARGET_DATE: "2026-06-04"
          TARGET_URL: "https://eipro.jp/takachiho1/eventCalendars/index"
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python monitor_takachiho.py

      - name: Upload screenshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takachiho-screenshot
          path: takachiho.png
          if-no-files-found: ignore
